name: Test game and container
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: python -m pytest -q
      - run: python scripts/validate_content.py
      - run: docker build -t bunker:test .
      - run: docker run --rm bunker:test python -c "from bunker.content import Content; Content().validate()"
